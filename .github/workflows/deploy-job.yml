name: Project deploy on K8s

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "${{vars.DOCKERHUB_USERNAME}}/tusker:${{github.sha}}" .

      - name: Push to Docker registry
        run: docker push "${{vars.DOCKERHUB_USERNAME}}/tusker:${{github.sha}}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create .pem file
        run: |
          echo "${{ secrets.PEM_CONTENT }}" > server.pem
          chmod 600 server.pem

      - name: Copy Kubernetes manifests
        run: |
          scp -i server.pem \
          k8s/deployment.yml \
           k8s/service.yml \
            ${{ vars.EC2_USERNAME }}@${{ secrets.EC2_IP}}:/tmp/

      - name: Apply Kubernetes Service
        run: |
          ssh -i server.pem \
          ${{ vars.EC2_USERNAME }}@${{ secrets.EC2_IP }} \
          "kubectl apply -f /tmp/service.yml"

      - name: Deploy application
        run: |
          ssh -i server.pem \
          ${{ vars.EC2_USERNAME }}@${{ secrets.EC2_IP }} \
          "sed -i 's|IMAGE_PLACEHOLDER|${{ vars.DOCKERHUB_USERNAME }}/tusker:${{ github.sha }}|' /tmp/deployment.yml && \
          kubectl apply -f /tmp/deployment.yml"
